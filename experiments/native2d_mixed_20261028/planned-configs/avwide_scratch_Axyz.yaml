augmentation:
  coordinate_order:
  - D
  - H
  - W
  normalization_denominator: axis_size
  plants:
    flip:
      axes:
      - D
      - H
      - W
      enabled: true
      probability_per_axis: 0.5
    intensity_scale:
    - -0.5
    - 0.5
    pad_to_image_size: true
    padding: 5
    projection_depth: 5
    rotate_90:
      enabled: true
      planes:
      - - D
        - H
      - - D
        - W
      - - H
        - W
  synthetic_mri:
    gaussian_noise:
      enabled: true
      probability: 0.35
      std_range:
      - 0.0
      - 0.015
    intensity_clamp: null
    rotate_90:
      enabled: true
      planes:
      - - D
        - H
      - - D
        - W
      - - H
        - W
    zoom:
      enabled: true
      image_interpolation: trilinear
      range:
      - 0.6
      - 1.0
      segmentation_interpolation: nearest
data:
  batch_size: 4
  datasets:
    avwide:
      manifest: /lustre/fswork/projects/rech/vnc/upz25mj/projects/DenseVesselGraph/experiments/native2d_long_20261028/avwide/manifest.json
  image_size:
  - 128
  - 128
  input_modality: paired_raw_2d_image
  manifest: /lustre/fswork/projects/rech/vnc/upz25mj/projects/DenseVesselGraph/experiments/native2d_long_20261028/avwide/manifest.json
  mixed_sampling:
    balance_source_target: true
    epoch_size: twice_source
  spatial_dims: 2
  train_augmentation: true
domain_adaptation:
  alpha_coefficient: 1.0
  class_weights:
  - 0.05
  - 0.95
  consistency_regularization: true
  enabled: false
  graph_adversarial: true
  hidden_size: 2048
  image_adversarial: true
  learning_rate: 7.0e-05
evaluation:
  bn_calibration_batches: 0
  edge_threshold: 0.5
  interval_epochs: 5
  node_threshold: 0.5
  node_type_degree_caps: false
  node_type_degree_penalty: 0.0
  protocol:
    edge_half_width: 0.1
    f1_iou_threshold: 0.5
    folds: 5
    iou_thresholds:
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
    max_detections: 40
    smd_epsilon: 1.0e-07
    smd_iterations: 100
    smd_points: 100
    target_node_size: 0.2
  training_metrics:
    dataset: synthetic_mri
    enabled: false
    max_samples: 200
    save_best_checkpoint: false
    save_f1_checkpoints: false
    selection_metric: edge_mAP
    selection_mode: max
experiment:
  initialization: scratch
  name: native2d-long-avwide-Axyz
  output_dir: ${GNBM_OUTPUT_DIR}
  seed: 364505
loss:
  degree:
    enabled: false
    ramp_epochs: 0
    warmup_epochs: 0
    weight: 0.0
  edge:
    balancing:
      mode: ratio_upsample
      positive_to_negative_ratio: 0.15
      tolerance: 0.02
    candidates:
      include_unmatched: false
      max_active_unmatched: 32
      max_per_graph: 9999
      max_unmatched_pairs_per_graph: 256
      positive_cap: null
      unmatched_object_threshold: 0.25
      unmatched_ramp_epochs: 0
      unmatched_warmup_epochs: 0
      unmatched_weight: 1.0
    classification:
      class_weights:
      - 1.0
      - 1.0
      curriculum:
        enabled: false
        end_percent: 30.0
        start_percent: 10.0
      focal_gamma: 2.0
      name: cross_entropy
  enabled:
  - boxes
  - class
  - cardinality
  - nodes
  - edges
  - spline
  node:
    classification:
      class_weights:
      - 1.0
      - 1.0
      curriculum:
        enabled: false
        end_percent: 30.0
        start_percent: 10.0
      focal_gamma: 2.0
      name: focal
  node_type:
    classification:
      class_weights:
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      curriculum:
        enabled: false
        end_percent: 30.0
        start_percent: 10.0
      focal_gamma: 2.0
      name: cross_entropy
  spline:
    beta_distance: 1.0
    mode: controls
    target: residual
  supervise_target_graphs: true
  weights:
    boxes: 3.0
    cardinality: 0.8
    class: 4.0
    domain: 1.0
    edges: 6.0
    node_types: 1.0
    nodes: 2.0
    spline: 1.4739989612791453
model:
  decoder:
    activation: relu
    attention_heads: 8
    decoder_layers: 3
    decoder_points: 4
    dropout: 0.1
    dummy_tokens: 0
    encoder_layers: 3
    encoder_points: 4
    feature_levels: 4
    feedforward_dim: 1024
    hidden_dim: 512
    object_queries: 96
    relation_attention: false
    relation_tokens: 5
    type: deformable_detr
    use_cuda_extension: true
  encoder:
    backbone: resnet101
    depths:
    - 4
    - 4
    - 16
    - 4
    dilation: false
    init_weights: null
    input_channels: 1
    strides:
    - 1
    - 2
    - 2
    - 2
    train_all: true
    type: se_resnet
  matcher:
    class_cost: 2.0
    node_cost: 5.0
    type: hungarian
  node_refinement:
    enabled: true
    image_mode: full
    radius_pixels: 4.0
  node_type:
    enabled: false
  num_classes: 2
  spline:
    controls: 8
    enabled: true
    gradient_route: graph_only
    samples: 64
runtime:
  deterministic: false
  device: cuda
  distributed: false
  pin_memory: true
  workers: 4
schema_version: 1
topology:
  betti_h0:
    diagonal_factor: 0.5
    enabled: false
    log_only: true
    normalize: true
    ramp_epochs: 0
    unmatched_weight: 1.0
    warmup_epochs: 0
    weight: 0.0
  betti_h1:
    diagonal_factor: 0.5
    enabled: false
    false_negative_weight: 1.0
    false_positive_weight: 1.0
    log_only: true
    normalize: true
    ramp_epochs: 0
    warmup_epochs: 0
    weight: 0.0
tracking:
  enabled: true
  entity: null
  group: null
  mode: null
  project: focal-loss
  save_code: true
  tags:
  - gnbm
training:
  checkpoint:
    interval_epochs: 5
    latest_interval_epochs: 1
    policy: interval_and_best
  early_stopping:
    enabled: false
    min_delta: 0.0
    min_epochs: 0
    mode: max
    monitor: edge_mAP
    patience_epochs: 50
  epochs: 100
  input: image
  native2d_protocol:
    augmentation: deterministic D4 per exposure
    backbone_lr: 2.0e-05
    epochs: 100
    finetune_data: vessel cohort only; no plant replay
    pretraining_geometry: pixel units for both domains; REAVER uses calibrated microns
      again at finetuning
    schedule: cosine to10% base LR over the declared full epoch budget
    selection: fixed interim subset edge micro F1 at2 native distance units; latest
      trained tie
    source_geometry: supplied sparse plant graph segments; no claim of independent
      dense manual curves
    stage: vessel-only target training
    stopping: exact fixed epochs, stop on nonfinite/error, no automatic extension
    test_policy: no test loading or inference
    units: pixel
    warmup_updates: 100
  optimizer:
    base_lr: 0.0002
    betas:
    - 0.9
    - 0.999
    epsilon: 1.0e-08
    name: adamw
    weight_decay: 0.0001
  scheduler:
    name: polynomial
    power: 0.9
    warmup_lr: 1.0e-09
  start_epoch: 0
  warmup_epochs: 1
